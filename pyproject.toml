[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-ops"
version = "0.1.0"
description = "Runtime plane for models in production. Pins, rollouts, drift, cost and the feedback loop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eranga Mapa" }]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "numpy>=1.26",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["llmops"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
